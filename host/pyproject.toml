[project]
name = "drift-host"
version = "0.1.0"
description = "Native-messaging host for the drift browser extension: discovers AirPlay receivers and streams to them."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alex Papish" }]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "platformdirs>=4.3",
    # Mirroring uses pyatv internals (no public mirroring API): pinned to a minor version; tests/test_pyatv_compat.py
    # imports everything drift_host/mirror/pyatv_control.py relies on.
    "pyatv>=0.18,<0.19",
    # Not used directly: pyatv's AirPlay pairing passes `private` positionally to SRPClientSession, which srptools 2.0
    # made keyword-only (pairing fails with "takes 2 positional arguments"). Lift when pyatv supports srptools 2;
    # tests/test_pyatv_compat.py checks it.
    "srptools>=1.0.1,<3",
]

[project.scripts]
drift-host = "drift_host.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift_host"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PTH", "TID"]
ignore = [
    "S101", # assert is how pytest checks
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess.call".msg = "Use asyncio.create_subprocess_exec with an argument list (never a shell)."
"os.system".msg = "Never run a shell."

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# Calls pyatv internals (SRP handlers) that have no type hints.
[[tool.mypy.overrides]]
module = ["tests.test_pyatv_compat"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
